<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이브 코딩</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button id="darkModeToggle">Toggle Dark Mode</button>
        <h1>바이브 코딩이란?</h1>
        <p>바이브 코딩은 정해진 규칙이나 형식에 얽매이지 않고, 개발자의 감성과 직관에 따라 자유롭게 코드를 작성하는 프로그래밍 스타일을 의미합니다. 마치 재즈 연주자가 악보를 넘어 즉흥적으로 연주하듯, 코드를 통해 자신의 생각과 느낌을 표현하는 것을 중요하게 생각합니다.</p>
        <p>이러한 접근 방식은 창의적인 문제 해결과 독창적인 결과물 도출에 도움을 줄 수 있지만, 협업 환경에서는 코드의 가독성과 유지보수 측면에서 어려움을 야기할 수도 있습니다. 따라서 바이브 코딩을 적용할 때는 팀원들과의 충분한 소통과 합의가 중요합니다.</p>
    </div>
</body>
</html>
